module:
  mounts:
    - source: content/pages
      target: content

    - source: content/posts
      target: content/blog

    - source: media
      target: assets/media

    - source: data
      target: data

    - source: data/tina-cms
      target: tina

    - source: theme/archetypes
      target: archetypes

    - source: theme/layouts
      target: layouts

    - source: theme/assets
      target: assets
