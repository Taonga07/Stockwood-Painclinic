baseURL = "https://stockwood-painclinic.co.uk/"
title = "Stockwood Pain Clinic"
languageCode = "en-gb"

# Editable via TinaCMS -> Configuration -> Site Settings.
disableKinds = ["taxonomy", "term"]
enableRobotsTXT = true
summarylength = 30
defaultContentLanguage = "en-gb"
timeout = "60s"

[pagination]
  pagerSize = 10

[sitemap]
  changefreq = "monthly"
  priority = 0.5

[services.googleAnalytics]
  ID = ""

[minify]
  minifyOutput = true

[params]
  favicon = "favicon.png"

