{{ define "main" }}
<section class="page-hero">
  <div class="wrap">
    <p class="eyebrow">Booking</p>
    <h1>{{ .Title }}</h1>
  </div>
</section>

<div class="divider divider-small" aria-hidden="true">
  <svg viewBox="0 0 1200 40" preserveAspectRatio="none"><path d="M0 20 C 150 0, 300 40, 450 20 S 750 0, 900 20 S 1150 40, 1200 20" /></svg>
</div>

<section class="section">
  <div class="wrap">
    <div id="ob-container">Loading online booking&hellip;</div>

    {{ with .Content }}<div class="section-intro" style="text-align:center; margin-top:2em;">{{ . }}</div>{{ end }}
  </div>
</section>

<script>
  var widgetId = {{ .Params.booking_widget_id | default 0 }};
  var unavailableMessage = {{ .Params.unavailable_message }};

  function ppsOnlineBooking() {
    new OnlineBooking({ container: "ob-container", id: widgetId });
  }

  (function () {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", "https://ob.rushcliff.com/status-check", true);
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      if (xhr.status === 200 && xhr.responseText === "live") {
        var script = document.createElement("script");
        script.src = "https://ob.rushcliff.com/js/obv4.js";
        document.head.appendChild(script);
      } else {
        document.getElementById("ob-container").innerHTML =
          "<p>" + unavailableMessage + "</p>";
      }
    };
    xhr.send();
  })();
</script>
{{ end }}
