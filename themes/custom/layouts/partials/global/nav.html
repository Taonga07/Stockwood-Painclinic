{{ $currentPage := . }}
<nav class="main-nav" id="mainNav">
  <ul>
    {{ range site.Menus.main }}
      {{ if not .Parent }}
      <li class="{{ if .HasChildren }}has-children{{ end }}">
        <a href="{{ .URL }}" {{ if $currentPage.IsMenuCurrent "main" . }}aria-current="page"{{ end }}>{{ .Name }}</a>
        {{ if .HasChildren }}
        <ul class="sub-nav">
          {{ range .Children }}
          <li><a href="{{ .URL }}">{{ .Name }}</a></li>
          {{ end }}
        </ul>
        {{ end }}
      </li>
      {{ end }}
    {{ end }}
  </ul>
</nav>
