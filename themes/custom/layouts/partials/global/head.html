<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }} &mdash; Osteopath, Stockwood, Bristol{{ else }}{{ .Title }} &mdash; {{ site.Title }}{{ end }}</title>
<meta name="description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ site.Params.description }}{{ end }}">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
{{ $opts := dict "targetPath" "css/style.css" "outputStyle" (cond hugo.IsProduction "compressed" "expanded") }}
{{ $style := resources.Get "scss/main.scss" | css.Sass $opts }}
{{ if hugo.IsProduction }}{{ $style = $style | fingerprint }}{{ end }}
<link rel="stylesheet" href="{{ $style.RelPermalink }}"{{ with $style.Data.Integrity }} integrity="{{ . }}"{{ end }}>
