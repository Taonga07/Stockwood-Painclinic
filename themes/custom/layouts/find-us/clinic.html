{{ define "main" }}
<section class="page-hero">
  <div class="wrap">
    <p class="eyebrow"><a href="/find-us/">Find Us</a></p>
    <h1>{{ .Title }}</h1>
  </div>
</section>

<div class="divider divider-small" aria-hidden="true">
  <svg viewBox="0 0 1200 40" preserveAspectRatio="none"><path d="M0 20 C 150 0, 300 40, 450 20 S 750 0, 900 20 S 1150 40, 1200 20" /></svg>
</div>

<section class="section">
  <div class="wrap article-layout">
    <article class="article-content">
      {{ .Content }}
      {{ with .Params.map_embed_url }}
      <iframe src="{{ . | safeURL }}" width="100%" height="450" style="border:0;" allowfullscreen loading="lazy"></iframe>
      {{ end }}
    </article>
    {{ partial "global/sidebar.html" . }}
  </div>
</section>
{{ end }}
