{{ define "main" }}
<section class="page-hero">
  <div class="wrap">
    <p class="eyebrow"><a href="/blog/">Blog</a></p>
    <h1>{{ .Title }}</h1>
    <time class="post-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time>
  </div>
</section>

<div class="divider divider-small" aria-hidden="true">
  <svg viewBox="0 0 1200 40" preserveAspectRatio="none"><path d="M0 20 C 150 0, 300 40, 450 20 S 750 0, 900 20 S 1150 40, 1200 20" /></svg>
</div>

<section class="section">
  <div class="wrap article-layout">
    <article class="article-content">
      {{ .Content }}
      <p class="back-link"><a href="/blog/">&larr; Back to all posts</a></p>
    </article>
    {{ partial "global/sidebar.html" . }}
  </div>
</section>
{{ end }}
