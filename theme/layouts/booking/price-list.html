{{ define "main" }}
<section class="page-hero">
  <div class="wrap">
    <p class="eyebrow">Booking</p>
    <h1>{{ .Title }}</h1>
  </div>
</section>

<div class="divider divider-small" aria-hidden="true">
  <svg viewBox="0 0 1200 40" preserveAspectRatio="none"><path d="M0 20 C 150 0, 300 40, 450 20 S 750 0, 900 20 S 1150 40, 1200 20" /></svg>
</div>

<section class="section">
  <div class="wrap">
    {{ with .Content }}<div class="section-intro">{{ . }}</div>{{ end }}

    <div class="price-grid">
      {{ range .Params.plans }}
      <div class="price-card">
        <h3>{{ .name }}</h3>
        <p class="price">{{ .price }}</p>
        <ul>
          {{ range .features }}
          <li>{{ . }}</li>
          {{ end }}
        </ul>
        <a class="btn btn-primary" href="/booking/online-booking/">Book Online</a>
      </div>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
