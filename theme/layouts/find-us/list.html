{{ define "main" }}
<section class="page-hero">
  <div class="wrap">
    <h1>{{ .Title }}</h1>
  </div>
</section>

<div class="divider divider-small" aria-hidden="true">
  <svg viewBox="0 0 1200 40" preserveAspectRatio="none"><path d="M0 20 C 150 0, 300 40, 450 20 S 750 0, 900 20 S 1150 40, 1200 20" /></svg>
</div>

<section class="section">
  <div class="wrap">
    {{ with .Content }}<div class="section-intro" style="text-align:center; max-width:none;">{{ . }}</div>{{ end }}

    <div class="clinic-grid">
      {{ range .Params.clinics }}
      <div class="clinic-card">
        <a href="{{ .link }}"><img src="{{ .image }}" alt="{{ .name }}"></a>
        <h3><a href="{{ .link }}">{{ .name }}</a></h3>
      </div>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
