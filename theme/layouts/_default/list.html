{{ define "main" }}
<section class="page-hero">
  <div class="wrap">
    <h1>{{ .Title }}</h1>
  </div>
</section>

<div class="divider divider-small" aria-hidden="true">
  <svg viewBox="0 0 1200 40" preserveAspectRatio="none"><path d="M0 20 C 150 0, 300 40, 450 20 S 750 0, 900 20 S 1150 40, 1200 20" /></svg>
</div>

<section class="section">
  <div class="wrap">
    {{ with .Content }}<div class="section-intro">{{ . }}</div>{{ end }}

    {{ if .Pages }}
    <div class="card-grid">
      {{ range .Pages.ByTitle }}
      <a class="page-card" href="{{ .RelPermalink }}">
        <h3>{{ .Title }}</h3>
        {{ if .Summary }}<p>{{ .Summary | plainify | truncate 110 }}</p>{{ end }}
        <span class="card-link">Read more &rarr;</span>
      </a>
      {{ end }}
    </div>
    {{ end }}
  </div>
</section>
{{ end }}
