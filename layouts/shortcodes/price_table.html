{{- /* Wrapper for pricing plans. Children: price-plan. Falls back to site data if empty. */ -}}
<div class="price-grid">
  {{ if .Inner }}{{ .Inner }}{{ else }}
    {{ range site.Data.pricing.plans }}
    <div class="price-card">
      <h3>{{ .name }}</h3>
      <p class="price">{{ .price }}</p>
      <ul>{{ range .features }}<li>{{ . }}</li>{{ end }}</ul>
      <a class="btn btn-primary" href="/booking/online-booking/">Book Online</a>
    </div>
    {{ end }}
  {{ end }}
</div>
