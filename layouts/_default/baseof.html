<!DOCTYPE html>
<html lang="{{ site.LanguageCode | default "en-gb" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {{ partial "header.html" . }}
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ $jsOpts := dict "minify" true "target" "es2015" }}
  {{ $mainJS := resources.Get "script/main.js" | js.Build $jsOpts | resources.Minify | resources.Fingerprint }}
  <script src="{{ $mainJS.RelPermalink }}" integrity="{{ $mainJS.Data.Integrity }}"></script>
</body>
</html>
