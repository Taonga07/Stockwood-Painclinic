{{- $contact := site.Data.config.contact -}}
<div class="topbar">
  <div class="wrap topbar-inner">
    <div class="topbar-contact">
      <a href="{{ $contact.phone_href | safeURL }}">{{ $contact.phone }}</a>
      <span class="sep">&middot;</span>
      <a href="mailto:{{ $contact.email }}">{{ $contact.email }}</a>
    </div>
    <a class="topbar-cta" href="/booking/online-booking/">Book an appointment</a>
  </div>
</div>
