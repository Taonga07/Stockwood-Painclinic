<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    // Applies any explicit light/dark choice before first paint, so
    // there's no flash of the wrong theme on load — see theme.js for
    // where this same key is written. Kept deliberately tiny and
    // inline (not a module import) since it has to run before
    // styles.css is applied below.
    (function () {
      try {
        var t = localStorage.getItem("driftwood-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Driftwood CMS</title>
  <link rel="stylesheet" href="driftwood-cms.taongaws07.workers.dev/styles.css">
  <!--
    This Worker deployment is shared across many sites (see
    src/index.js) — app.js normally figures out where its own Worker
    is from its own script URL. Only set this if you're intentionally
    pointing at a different deployment than the one serving this file:
    <script>window.DRIFTWOOD_WORKER_URL = "https://a-different-worker.workers.dev";</script>
  -->
</head>
<body>
  <div id="admin-root">
    <div class="gate"><h1>Loading…</h1></div>
  </div>
  <script type="module" src="driftwood-cms.taongaws07.workers.dev/app.js"></script>
</body>
</html>
